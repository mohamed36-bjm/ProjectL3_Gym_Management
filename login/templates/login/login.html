<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PowerFitness</title>
    <style>
        :root {
            --primary: #26B99A;
            --card-bg: #222222;
            --text-white: #ffffff;
            --text-gray: #AAB2BD;
            --border-color: #333333;
        }

        body {
            background-color: #121212;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .formulaire-father {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .formulaire {
            width: 100%;
            max-width: 400px;
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
        }

        h1 {
            color: var(--text-white);
            font-size: 24px;
            text-align: center;
            margin-bottom: 30px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background-color: #1A1A1A;
            color: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 20px;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 8px rgba(38, 185, 154, 0.2);
        }

        .links-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .formulaire a {
            color: var(--text-gray);
            text-decoration: none;
            font-size: 13px;
            transition: 0.3s;
        }

        .formulaire a:hover {
            color: var(--primary);
        }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            border: none;
            margin-bottom: 12px;
        }

        .btn-login {
            background-color: var(--primary);
            color: white;
        }

        .btn-login:hover {
            background-color: #1f9e83;
        }

        .btn-manager {
            background-color: transparent;
            color: var(--text-white);
            border: 1px solid var(--border-color);
        }

        .btn-manager:hover {
            background-color: #333;
            border-color: var(--text-gray);
        }

        .alert-danger p {
            background-color: rgba(231, 76, 60, 0.1);
            color: #ff6b6b;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid rgba(231, 76, 60, 0.2);
        }
    </style>
</head>
<body>

<div class="formulaire-father">
    <div class="formulaire">
        <h1>Connecter à votre compte</h1>
        <!--post method pour envoyer les donnees au serveur de maniere chiffre et securiser-->
        <form method="POST">
            {% csrf_token %}
            
            <input type="email" name="email" placeholder="E-mail" required autocomplete="email">
            <input type="password" name="password" placeholder="Mot de passe" required>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert-danger">
                        <p>{{ message }}</p>
                    </div>
                {% endfor %}
            {% endif %}

            <div class="links-container">
                <a href="#">Mot de passe oublié ?</a>
                <a href="{% url 'creationcompte' %}" style="color: var(--primary);">Créer un compte..!</a>
            </div>

            <button type="submit" name="btn_type" value="login" class="btn-login">Login</button>
            <a href="{% url 'manager_login' %}">
                <button type="button" class="btn-manager">Entrer en tant que manager</button>
            </a>
        </form>
    </div>
</div>

</body>
</html>
